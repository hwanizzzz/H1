# ─────────────────────────────────────────────────────────────────────────────
# 로컬 오버라이드 예시 파일
#
# 사용법:
#   1) 이 파일을 config/config.local.yaml 이름으로 복사
#   2) 본인의 계좌번호·비밀번호로 채우기
#   3) 그대로 실행 — config/config.yaml 위에 병합되어 사용됨
#
# 이 파일(config.local.yaml)은 .gitignore 에 등록돼 있어 git 커밋 대상이 아닙니다.
# 절대 이 파일을 직접 커밋하지 마세요.
# ─────────────────────────────────────────────────────────────────────────────

api:
  account_no: "여기에_모의계좌번호"     # 예: "12345678-01"
  account_pw: "여기에_계좌비밀번호"
  is_mock: true                         # 모의는 반드시 true
  # progid: "여기에_감지된_ProgID"      # python tools/find_progid.py 실행 후 얻은 값
                                        # 기본값으로 접속 실패 시에만 지정

account_safety:
  mock_accounts:
    - "여기에_모의계좌번호"             # 위 account_no 와 동일하게
  live_accounts:
    - "여기에_본인_실계좌번호"          # 메인 실거래 계좌(등록만 — 이 봇이 쓰지 않음)
  require_registration: true

# 필요 시 리스크·종목별 파라미터도 오버라이드 가능:
# risk:
#   account_equity: 5000000              # 모의 계좌 실제 잔고에 맞춰 조정
#   risk_per_trade_pct: 2.0              # 3%가 부담되면 낮춰서 시작
