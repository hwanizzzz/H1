# 하나증권 1Q Open API 설정
api:
  account_no: "YOUR_ACCOUNT_NO"      # 계좌번호 (예: 12345678-01)
  account_pw: "YOUR_ACCOUNT_PW"      # 계좌 비밀번호
  is_mock: true                       # true: 모의투자, false: 실계좌

# ── 단일 종목 (main.py 사용) ────────────────────────────────────────────────
# 기본: CME 호주달러 선물(6A)
symbol:
  code: "6A"                          # 기준 종목코드
  name: "AUD/USD"
  exchange: "CME"
  contract_code: ""                   # 정확한 월물 지정(예: "M26"=6월). 비우면 분기물 자동
  tick_size: 0.0001
  tick_value: 10.0                    # 6A: 1틱=$10
  timeframe: "1D"                     # 1D / 4H / 1H / 30M / 5M / 1M
  strategy:
    name: "donchian_breakout"         # donchian_breakout / ma_crossover / mean_reversion
    donchian_entry_period: 20
    donchian_exit_period: 10
    atr_period: 14
    atr_multiplier: 2.0

# ── 다종목 포트폴리오 (portfolio_main.py 사용) ──────────────────────────────
# 금(MGC) + S&P(MES) 마이크로 동시 운용
# ※ 종목코드/월물 표기는 증권사마다 다를 수 있음 — 1QHTS 에서 확인 후
#   contract_code 를 정확히 입력하세요. (예: 금 4월물 → "J26")
symbols:
  - code: "MGC"                       # E-micro Gold (10oz)
    name: "E-micro Gold"
    exchange: "COMEX"
    contract_code: "Q26"              # 8월물 (1QHTS 확인: MGCQ26, 거래량 128k)
    tick_size: 0.10
    tick_value: 1.0                   # MGC: 1틱(0.10)=$1.00
    timeframe: "1D"
    strategy:
      name: "donchian_breakout"
      donchian_entry_period: 20
      donchian_exit_period: 10
      atr_period: 14
      atr_multiplier: 2.0

  - code: "MES"                       # Micro E-mini S&P 500
    name: "Micro E-mini S&P 500"
    exchange: "CME"
    contract_code: "U26"              # 9월물 (만기 2026-09-18) — M26 만기(6/19) 회피 위해 선제 전환
                                      # ※ 다음 롤오버: 9월 둘째 주쯤 Z26(12월물)으로 변경
    tick_size: 0.25
    tick_value: 1.25                  # MES: 1틱(0.25)=$1.25
    timeframe: "1D"
    strategy:
      name: "ma_crossover"
      fast_period: 9
      slow_period: 21
      adx_period: 14
      adx_threshold: 25.0
      atr_period: 14
      atr_multiplier: 1.5

# ── 리스크 관리 (계좌 단위, 다종목 공유) ────────────────────────────────────
# 공격형 설정: 거래당 3% 리스크
risk:
  account_equity: 10000000            # 계좌 자산 (원화)
  risk_per_trade_pct: 3.0             # 1회 거래 리스크 3% (공격형)
  daily_loss_limit_pct: 6.0           # 일일 최대 손실 한도 6%
  max_positions: 3                    # 최대 동시 포지션 수
  max_contracts_per_trade: 5          # 1회 최대 계약 수
  usd_krw_rate: 1350.0                # USD/KRW 환산율

# ── 실행 설정 ────────────────────────────────────────────────────────────────
execution:
  check_interval_sec: 60
  order_type: "MARKET"                # MARKET: 시장가, LIMIT: 지정가
  slippage_ticks: 1

# ── 로깅 설정 ────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  log_dir: "logs"
  max_file_size_mb: 10
  backup_count: 5
