# ─────────────────────────────────────────────────────────────────────────────
# 하나증권 Open API (1Q Pro) 자동매매 — 공용 설정
#
# 계좌번호·비밀번호·인증정보는 이 파일에 넣지 마세요.
# → config/config.local.yaml 에 오버라이드하세요 (.gitignore 로 커밋 차단됨).
# 템플릿: config/config.local.example.yaml 참고
# ─────────────────────────────────────────────────────────────────────────────

api:
  # OpenAPI 설치 루트 (아래에 TranRes/, RealRes/ 폴더가 있어야 함)
  # 실제 설치: C:\1QOpenAPI\1Q OpenAPI\1QApiAgent
  openapi_root: "C:/1QOpenAPI/1Q OpenAPI/1QApiAgent"

  # COM ProgID (기본값 사용 권장. 문제 시 tools/find_progid.py --dispatch)
  progid: "HFCOMMAGENT.HFCommAgentCtrl.1"

  # 로그인 정보 — 실제 값은 config.local.yaml 에 입력
  # 하나 API 는 세 종류 비밀번호가 다 다릅니다:
  #   login_pw   : 하나증권 홈페이지 로그인 비밀번호 (CommLogin 2번째 인자)
  #   account_pw : 계좌 비밀번호 (주문·조회 시 사용, 보통 숫자)
  #   cert_pw    : 공동인증서 비밀번호 (CommLogin 3번째 인자)
  user_id: "YOUR_USER_ID"
  account_no: "YOUR_ACCOUNT_NO"
  account_pw: "YOUR_ACCOUNT_PW"      # 계좌 비번
  login_pw: ""                       # 홈페이지 로그인 비번 (use_cloud_cert=false 일 때 필요)
  cert_pw: ""                        # 공동인증서 비번 (use_cloud_cert=false 일 때 필요)
  use_cloud_cert: true               # true: CommCloudCert(폰 승인), false: CommLogin(공동인증서 파일)

  is_mock: true                      # true: 해외모의(mode=2), false: 실거래(mode=0)

# ── 계좌 안전 검증 (사고 방지 — 매우 중요) ─────────────────────────────────
# 메인 계좌 실거래와 봇의 모의계좌를 혼동하지 않도록 계좌번호를 명시 등록.
account_safety:
  mock_accounts: []                   # 모의투자 계좌번호 목록
  live_accounts: []                   # 실계좌 번호 목록 (메인 실거래 계좌 등)
  require_registration: true

# ── 단일 종목 (main.py 사용) ────────────────────────────────────────────────
symbol:
  code: "MGC"                         # 기준 심볼
  name: "E-micro Gold"
  exchange: "COMEX"
  contract_code: "Q26"                # 월물 접미어 → 주문 종목코드 = MGC + Q26 = MGCQ26
  quote_code: ""                      # 비우면 주문코드와 동일. v3.2 부터 분리 가능
  tick_size: 0.10
  tick_value: 1.0                     # MGC: 1틱(0.10)=$1.00
  timeframe: "1D"
  strategy:
    name: "donchian_breakout"
    donchian_entry_period: 20
    donchian_exit_period: 10
    atr_period: 14
    atr_multiplier: 2.0

# ── 다종목 포트폴리오 (portfolio_main.py 사용) ──────────────────────────────
# 금(MGC) + S&P(MES) 마이크로 동시 운용
symbols:
  - code: "MGC"                       # E-micro Gold (10oz)
    name: "E-micro Gold"
    exchange: "COMEX"
    contract_code: "Q26"              # 8월물 (1QHTS: MGCQ26)
    quote_code: ""
    tick_size: 0.10
    tick_value: 1.0
    timeframe: "1D"
    strategy:
      name: "donchian_breakout"
      donchian_entry_period: 20
      donchian_exit_period: 10
      atr_period: 14
      atr_multiplier: 2.0

  - code: "MES"                       # Micro E-mini S&P 500
    name: "Micro E-mini S&P 500"
    exchange: "CME"
    contract_code: "U26"              # 9월물 (M26 6/19 만기 회피)
    quote_code: ""
    tick_size: 0.25
    tick_value: 1.25
    timeframe: "1D"
    strategy:
      name: "ma_crossover"
      fast_period: 9
      slow_period: 21
      adx_period: 14
      adx_threshold: 25.0
      atr_period: 14
      atr_multiplier: 1.5

# ── 리스크 관리 (계좌 단위, 다종목 공유) ────────────────────────────────────
risk:
  account_equity: 10000000            # 원화 기준 계좌 자산
  risk_per_trade_pct: 3.0             # 거래당 리스크 3% (공격형)
  daily_loss_limit_pct: 6.0
  max_positions: 3
  max_contracts_per_trade: 5
  usd_krw_rate: 1350.0

# ── 실행 설정 ────────────────────────────────────────────────────────────────
execution:
  check_interval_sec: 60
  order_type: "MARKET"                # MARKET / LIMIT
  slippage_ticks: 1

logging:
  level: "INFO"
  log_dir: "logs"
  max_file_size_mb: 10
  backup_count: 5
