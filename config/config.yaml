# 하나증권 1Q Open API 설정
api:
  account_no: "YOUR_ACCOUNT_NO"      # 계좌번호 (예: 12345678-01)
  account_pw: "YOUR_ACCOUNT_PW"      # 계좌 비밀번호
  is_mock: true                       # true: 모의투자, false: 실계좌

# CME 호주달러 선물 (6A) 설정
symbol:
  code: "6A"                          # CME 호주달러 선물 코드
  exchange: "CME"
  contract_month: ""                  # 비워두면 최근월물 자동 선택 (예: "202506")
  tick_size: 0.0001                   # 최소가격변동단위
  tick_value: 10.0                    # 틱당 가치 (USD) - 6A: 1틱 = $10
  contract_size: 100000               # 계약당 호주달러 수량

# 전략 설정
# ─────────────────────────────────────────────────────────────────────
# 사용 가능한 전략:
#   - adaptive_trend     : (권장/기본) 4중 필터 적응형 추세 추종
#                           CME 6A 일봉 백테스트 기준 최고 수익률
#   - donchian_breakout  : 터틀 트레이딩 변형
#   - ma_crossover       : EMA 골든/데드크로스 + ADX 필터
strategy:
  name: "adaptive_trend"
  timeframe: "1D"                     # 봉 단위: 1D(일봉), 4H, 1H, 30M

  # 호주달러 선물 최적화 파라미터 (백테스트로 검증된 값)
  adaptive_trend:
    ema_trend_period: 200             # 장기 추세 필터
    donchian_period: 20               # 진입 채널 (신고가/신저가 돌파)
    adx_period: 14
    adx_threshold: 20.0               # 횡보장 진입 차단 임계값
    atr_period: 14
    atr_avg_period: 50                # ATR 장기 평균
    atr_ratio_min: 0.7                # 변동성 사망 구간 회피
    rsi_period: 14
    rsi_long_max: 75.0                # 과열 추격매수 차단
    rsi_short_min: 25.0
    initial_stop_atr: 2.0             # 초기 손절 = 2 × ATR (= 1R)
    chandelier_atr: 3.0               # 추적 손절 = 최고가 - 3 × ATR
    partial_take_r: 2.0               # +2R 도달 시 BE 이동

  # 보조 전략 (name 변경 시 사용)
  donchian_entry_period: 20
  donchian_exit_period: 10
  atr_period: 14
  atr_multiplier: 2.0

# 리스크 관리 설정
risk:
  account_equity: 10000000            # 계좌 자산 (원화, 예: 1천만원)
  risk_per_trade_pct: 1.0             # 1회 거래 리스크 (계좌의 1%)
  max_positions: 3                    # 최대 동시 포지션 수
  daily_loss_limit_pct: 3.0          # 일일 최대 손실 한도 (계좌의 3%)
  max_contracts_per_trade: 5          # 1회 최대 계약 수

# 실행 설정
execution:
  check_interval_sec: 60              # 전략 체크 주기 (초)
  order_type: "MARKET"                # MARKET: 시장가, LIMIT: 지정가
  slippage_ticks: 1                   # 예상 슬리피지 (틱)

# 로깅 설정
logging:
  level: "INFO"                       # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  max_file_size_mb: 10
  backup_count: 5
