# =============================================================================
#  최종 운용안 (백테스트 2020~2025 검증 결과 기반)
#
#  [검증된 시스템 = 2종 분산]
#    · 금(Gold)   : 돌파전략(Donchian+추세필터)  ← 이 파일이 설정하는 1차 대상
#    · S&P500     : 평균회귀전략(눌림목 매수)      ← 다종목 엔진 확장 후 추가
#    · 합산 백테스트(리스크2%): +81%, 최대손실 -13%
#
#  [확정 설정] 거래당 리스크 3% (공격형), 손절은 좁게(ATR×2 ≈ 2.4%)
#    ※ 손절을 넓히면 오히려 수익↓ (검증됨). ATR×2 유지.
#
#  ⚠️ 실거래 전 필수 확인:
#    1) 하나증권에서 금 선물(GC) 거래 가능 종목코드/월물 코드 확인
#    2) S&P 추가하려면 마이크로 MES 지원 여부 확인 (표준 ES는 2.5억으로 부족)
#    3) 반드시 모의투자(is_mock:true) → 소액 실계좌 순서로 진행
# =============================================================================

# 하나증권 1Q Open API 설정
api:
  account_no: "YOUR_ACCOUNT_NO"      # 계좌번호 (예: 12345678-01)
  account_pw: "YOUR_ACCOUNT_PW"      # 계좌 비밀번호
  is_mock: true                       # true: 모의투자, false: 실계좌

# 금(Gold) 선물 설정 — COMEX(CME그룹)
symbol:
  code: "GC"                          # ⚠️ 하나증권 실제 금선물 코드로 확인 필요 (표준 GC / 마이크로 MGC)
  exchange: "CME"
  contract_month: ""                  # ⚠️ 금은 비FX라 자동월물 부정확 → 활성 근월물 수동 지정 권장 (예: "202604")
  tick_size: 0.10                     # 금 최소가격변동단위 ($0.10)
  tick_value: 10.0                    # 표준 GC: 1틱($0.10)=$10  (마이크로 MGC면 1.0으로 변경)
  contract_size: 100                  # 표준 GC: 100 트로이온스 (MGC: 10)

# 전략 설정 — 금: Donchian 돌파 + 추세필터 (검증된 금 최적)
strategy:
  name: "donchian_breakout"           # 금=donchian_breakout / S&P=mean_reversion
  timeframe: "1D"                     # 일봉. (분봉 데이트레이딩은 검증 결과 손실 → 사용 안 함)
  donchian_entry_period: 20           # 진입 채널 기간 (20일 고/저)
  donchian_exit_period: 10            # 청산 채널 기간 (10일 고/저)
  atr_period: 14                      # ATR 계산 기간
  atr_multiplier: 2.0                 # 손절 ATR 배수 (좁게 유지 = 최적)
  trend_filter_period: 100            # 추세 필터 SMA 기간. 종가>SMA일 때만 롱
  # 평균회귀(S&P용) 파라미터: period=20, num_std=2.0, atr_multiplier=3.0, trend_filter_period=100

# 리스크 관리 설정 (공격형 확정: 거래당 3%)
risk:
  account_equity: 250000000           # 계좌 자산 (원화, 2.5억). 3% 리스크면 표준 GC 1계약 가능
  risk_per_trade_pct: 3.0             # ★ 거래당 리스크 3% (공격형). 실손실은 백테스트의 1.5~2배 각오
  max_positions: 2                    # 최대 동시 포지션 (금+S&P 확장 대비)
  daily_loss_limit_pct: 9.0          # 일일 최대 손실 한도 (3% × 3거래)
  max_contracts_per_trade: 10         # 1회 최대 계약 수
  usd_krw_rate: 1350.0                # 원/달러 환율 (USD 손익 → 원화 환산용)

# 실행 설정
execution:
  check_interval_sec: 60              # 전략 체크 주기 (초)
  order_type: "MARKET"                # MARKET: 시장가, LIMIT: 지정가
  slippage_ticks: 1                   # 예상 슬리피지 (틱)

# 로깅 설정
logging:
  level: "INFO"                       # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs"
  max_file_size_mb: 10
  backup_count: 5
